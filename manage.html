<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>작품 관리 · 미담</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="Icon/daisy-full.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Gowun Dodum', sans-serif; color: #2b2b2b; background: #fafafa;
      min-height: 100vh; padding: 24px 16px 60px;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(700px 600px at 50% -10%,
        rgba(255,248,200,0.7) 0%, rgba(255,248,200,0.25) 45%, transparent 75%);
    }
    .wrap { max-width: 720px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 22px; }
    header img { width: 44px; height: 44px; }
    header h1 { font-family: 'Gowun Batang', serif; font-size: 1.6rem; margin-top: 6px; }
    header p { color: #777; font-size: 0.9rem; margin-top: 4px; }

    .bar {
      display: flex; gap: 10px; align-items: center;
      background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.6);
      border-radius: 14px; padding: 14px; margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06); backdrop-filter: blur(10px);
    }
    .bar input {
      flex: 1; padding: 12px; font-family: inherit; font-size: 1rem;
      border: 1.5px solid #ddd; border-radius: 10px; outline: none; background: #fff;
    }
    .bar input:focus { border-color: #c9a227; box-shadow: 0 0 0 3px rgba(201,162,39,.15); }
    .bar .count { font-size: 0.85rem; color: #888; white-space: nowrap; }

    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .item {
      background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.06);
      border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
    }
    .item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #eee; display: block; }
    .item .meta { padding: 8px 10px; flex: 1; }
    .item .t { font-weight: 700; font-size: 0.92rem; line-height: 1.3; }
    .item .s { font-size: 0.78rem; color: #888; margin-top: 3px; }
    .item .s .g { color: #b08d1c; }
    .item button {
      margin: 0 10px 10px; padding: 9px; font-family: inherit; font-size: 0.9rem; font-weight: 700;
      color: #c62828; background: #fdecea; border: none; border-radius: 9px; cursor: pointer;
      transition: background .15s;
    }
    .item button:hover { background: #f9d6d2; }
    .item button:disabled { opacity: .5; cursor: not-allowed; }
    .item.gone { opacity: .35; pointer-events: none; }

    #msg { text-align: center; margin: 14px 0; font-size: 0.95rem; color: #888; }
    .back { display: block; text-align: center; margin-top: 24px; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="Icon/daisy-full.png" alt="" />
      <h1>작품 관리</h1>
      <p>삭제하려면 비밀번호를 입력하고 작품의 삭제 버튼을 누르세요</p>
    </header>

    <div class="bar">
      <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
      <input id="search" type="search" placeholder="제목 검색…" autocomplete="off" />
      <span class="count" id="count"></span>
    </div>

    <div id="msg">불러오는 중…</div>
    <div id="grid"></div>

    <a class="back" href="index.html">← 갤러리로 돌아가기</a>
  </div>

  <script>
    /* ───── upload.html 과 같은 Worker 주소 ───── */
    const WORKER_URL = 'https://midam-upload.midam-upload.workers.dev';
    /* ──────────────────────────────────────── */

    const $ = id => document.getElementById(id);
    const grid = $('grid'), msg = $('msg'), countEl = $('count');
    let ITEMS = [];

    /* 브라우저 WebP 지원 여부 */
    const SUPPORTS_WEBP = (() => {
      const c = document.createElement('canvas');
      return !!(c.getContext && c.toDataURL('image/webp').indexOf('data:image/webp') === 0);
    })();

    function parse(name) {
      const nfc = name.normalize('NFC');
      const base = nfc.replace(/\.(png|jpe?g)$/i, '');
      const [b] = nfc.split(/\.(?=[^.]+$)/);
      const parts = b.split('_');
      let [title = '', genre = '', date = ''] = parts;
      if (parts.length === 2) [title, date] = parts;
      return {
        filename: nfc,
        title: title.replace(/-/g, ' ').trim() || 'Untitled',
        genre: genre.trim(), date,
        src: `images/${nfc}`,
        thumb: SUPPORTS_WEBP ? `images/webp/${base}.webp` : `images/${nfc}`,
      };
    }

    async function load() {
      try {
        const res = await fetch(`images/images.json?v=${Date.now()}`, { cache: 'no-cache' });
        const files = await res.json();
        ITEMS = files.map(parse).sort((a, b) => b.date.localeCompare(a.date));
        render();
      } catch {
        msg.textContent = '목록을 불러오지 못했어요.';
      }
    }

    function render() {
      const q = $('search').value.normalize('NFC').trim().toLowerCase();
      const list = ITEMS.filter(m => !q || m.title.toLowerCase().includes(q));
      countEl.textContent = `${list.length}개`;
      msg.style.display = list.length ? 'none' : 'block';
      if (!list.length) msg.textContent = '작품이 없어요.';
      grid.innerHTML = '';
      list.forEach(m => {
        const div = document.createElement('div');
        div.className = 'item';
        const img = document.createElement('img');
        img.loading = 'lazy'; img.alt = m.title; img.src = m.thumb;
        img.onerror = function () { if (this.src !== location.origin + '/' + m.src) this.src = m.src; };
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = `<div class="t"></div><div class="s"><span class="g"></span> · <span class="d"></span></div>`;
        meta.querySelector('.t').textContent = m.title;
        meta.querySelector('.g').textContent = m.genre;
        meta.querySelector('.d').textContent = m.date;
        const btn = document.createElement('button');
        btn.textContent = '🗑 삭제';
        btn.onclick = () => del(m, div, btn);
        div.append(img, meta, btn);
        grid.appendChild(div);
      });
    }

    async function del(m, div, btn) {
      const pw = $('password').value;
      if (!pw) { alert('먼저 비밀번호를 입력하세요.'); $('password').focus(); return; }
      if (!confirm(`"${m.title}" (${m.genre} · ${m.date}) 작품을 정말 삭제할까요?\n되돌릴 수 없어요.`)) return;

      btn.disabled = true; btn.textContent = '삭제 중…';
      try {
        const fd = new FormData();
        fd.append('action', 'delete');
        fd.append('filename', m.filename);
        fd.append('password', pw);
        const res = await fetch(WORKER_URL, { method: 'POST', body: fd });
        if (res.ok) {
          div.classList.add('gone');
          btn.textContent = '삭제됨 ✓';
          ITEMS = ITEMS.filter(x => x.filename !== m.filename);
        } else if (res.status === 401) {
          alert('비밀번호가 맞지 않아요.'); btn.disabled = false; btn.textContent = '🗑 삭제';
        } else {
          const d = await res.json().catch(() => ({}));
          alert('삭제하지 못했어요: ' + (d.error || res.status));
          btn.disabled = false; btn.textContent = '🗑 삭제';
        }
      } catch {
        alert('인터넷 연결을 확인해 주세요.');
        btn.disabled = false; btn.textContent = '🗑 삭제';
      }
    }

    $('search').addEventListener('input', render);
    load();
  </script>
</body>
</html>
