<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>작품 올리기 · 관리 · 미담</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="Icon/daisy-full.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Gowun Dodum', sans-serif; color: #2b2b2b; background: #fafafa;
      min-height: 100vh; padding: 24px 16px 60px;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(700px 600px at 50% -10%,
        rgba(255,248,200,0.7) 0%, rgba(255,248,200,0.25) 45%, transparent 75%);
    }
    .wrap { max-width: 720px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 20px; }
    header img { width: 48px; height: 48px; }
    header h1 { font-family: 'Gowun Batang', serif; font-size: 1.7rem; margin-top: 6px; }
    header p { color: #777; font-size: 0.9rem; margin-top: 4px; }

    /* 탭 */
    .tabs { display: flex; gap: 8px; max-width: 460px; margin: 0 auto 16px; }
    .tabs button {
      flex: 1; padding: 12px; font-family: inherit; font-size: 1.05rem; font-weight: 700;
      color: #8a6d12; background: rgba(255,255,255,0.5); border: 1.5px solid transparent;
      border-radius: 12px; cursor: pointer; transition: background .15s, border-color .15s;
    }
    .tabs button.active { background: #c9a227; color: #fff; }

    /* 공유 비밀번호 */
    .pw-bar { max-width: 460px; margin: 0 auto 18px; }
    .pw-bar label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 6px; }
    .pw-bar .hint { font-weight: 400; color: #999; font-size: 0.82rem; }
    #password {
      width: 100%; padding: 13px; font-family: inherit; font-size: 1.05rem;
      background: #fff; border: 1.5px solid #ddd; border-radius: 12px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    #password:focus { border-color: #c9a227; box-shadow: 0 0 0 3px rgba(201,162,39,.15); }

    .card {
      max-width: 460px; margin: 0 auto;
      background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.6);
      border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      backdrop-filter: blur(12px); padding: 22px 20px;
    }
    label.fld { display: block; font-size: 1rem; font-weight: 700; margin: 18px 0 8px; }
    label.fld:first-of-type { margin-top: 0; }
    .hint { font-weight: 400; color: #999; font-size: 0.82rem; }

    input[type=text], input[type=date], select {
      width: 100%; padding: 14px; font-family: inherit; font-size: 1.05rem;
      color: #2b2b2b; background: #fff; border: 1.5px solid #ddd; border-radius: 12px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus { border-color: #c9a227; box-shadow: 0 0 0 3px rgba(201,162,39,.15); }

    .file-zone {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 26px; text-align: center;
      border: 2px dashed #d3b94e; border-radius: 14px;
      background: rgba(255,248,200,.35); color: #8a6d12; cursor: pointer;
    }
    .file-zone .ico { font-size: 2.2rem; }
    .file-zone span { font-size: 1.05rem; font-weight: 700; }
    #file-input { display: none; }
    #preview { display: none; width: 100%; margin-top: 14px; border-radius: 12px; }

    .submit {
      width: 100%; margin-top: 26px; padding: 16px;
      font-family: inherit; font-size: 1.2rem; font-weight: 700; color: #fff;
      background: #c9a227; border: none; border-radius: 14px; cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .submit:hover { background: #b08d1c; }
    .submit:active { transform: scale(.99); }
    .submit:disabled { background: #ccc; cursor: not-allowed; }

    #msg { margin-top: 18px; padding: 14px; border-radius: 12px; font-size: 1rem; text-align: center; display: none; }
    #msg.ok { display: block; background: #e8f5e9; color: #2e7d32; }
    #msg.err { display: block; background: #fdecea; color: #c62828; }
    #msg.work { display: block; background: #fff8e1; color: #8a6d12; }

    /* 관리 그리드 */
    .manage-head { max-width: 460px; margin: 0 auto 12px; display: flex; gap: 10px; }
    .manage-head input { flex: 1; padding: 12px; font-family: inherit; font-size: 1rem;
      border: 1.5px solid #ddd; border-radius: 10px; outline: none; background: #fff; }
    .manage-head .count { align-self: center; font-size: 0.85rem; color: #888; white-space: nowrap; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .item { background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.06);
      border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #eee; display: block; }
    .item .meta { padding: 8px 10px; flex: 1; }
    .item .t { font-weight: 700; font-size: 0.92rem; line-height: 1.3; }
    .item .s { font-size: 0.78rem; color: #888; margin-top: 3px; }
    .item .s .g { color: #b08d1c; }
    .item button { margin: 0 10px 10px; padding: 9px; font-family: inherit; font-size: 0.9rem; font-weight: 700;
      color: #c62828; background: #fdecea; border: none; border-radius: 9px; cursor: pointer; transition: background .15s; }
    .item button:hover { background: #f9d6d2; }
    .item button:disabled { opacity: .5; cursor: not-allowed; }
    .item.gone { opacity: .35; pointer-events: none; }
    #manage-msg { text-align: center; margin: 14px 0; font-size: 0.95rem; color: #888; }

    .back { display: block; text-align: center; margin-top: 24px; color: #888; font-size: 0.9rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="Icon/daisy-full.png" alt="" />
      <h1>미담 작품</h1>
      <p>새 작품을 올리거나, 올린 작품을 관리해요</p>
    </header>

    <div class="tabs">
      <button id="tab-upload" class="active">🖼 올리기</button>
      <button id="tab-manage">🗑 관리</button>
    </div>

    <div class="pw-bar">
      <label for="password">비밀번호 <span class="hint">— 미리 받은 암호를 적어요</span></label>
      <input id="password" type="password" autocomplete="current-password" />
    </div>

    <!-- ───── 올리기 ───── -->
    <section id="panel-upload">
      <form class="card" id="form">
        <label class="fld">사진 <span class="hint">— 그림을 찍은 사진이나 스캔 파일을 골라요</span></label>
        <label class="file-zone" for="file-input">
          <span class="ico">📷</span>
          <span id="file-label">사진 고르기 / 촬영하기</span>
        </label>
        <input id="file-input" type="file" accept="image/*" />
        <img id="preview" alt="미리보기" />

        <label class="fld" for="title">제목</label>
        <input id="title" type="text" placeholder="예) 가을 한옥" autocomplete="off" />

        <label class="fld" for="genre">종류</label>
        <select id="genre">
          <option value="수채">수채화</option>
          <option value="펜화">펜화</option>
          <option value="소묘">소묘</option>
          <option value="습작">습작</option>
          <option value="전시작품">전시작품</option>
          <option value="기타">기타</option>
        </select>

        <label class="fld" for="date">그린 날짜</label>
        <input id="date" type="date" />

        <button class="submit" id="submit" type="submit">올리기</button>
        <div id="msg"></div>
      </form>
    </section>

    <!-- ───── 관리 ───── -->
    <section id="panel-manage" class="hidden">
      <div class="manage-head">
        <input id="search" type="search" placeholder="제목 검색…" autocomplete="off" />
        <span class="count" id="count"></span>
      </div>
      <div id="manage-msg">목록을 불러오려면 위 탭을 누르세요</div>
      <div id="grid"></div>
    </section>

    <a class="back" href="index.html">← 갤러리로 돌아가기</a>
  </div>

  <script>
    /* ───── Cloudflare Worker 주소 ───── */
    const WORKER_URL = 'https://midam-upload.midam-upload.workers.dev';
    /* ────────────────────────────────── */

    const $ = id => document.getElementById(id);
    const SUPPORTS_WEBP = (() => {
      const c = document.createElement('canvas');
      return !!(c.getContext && c.toDataURL('image/webp').indexOf('data:image/webp') === 0);
    })();

    /* ── 탭 전환 ── */
    let manageLoaded = false;
    $('tab-upload').onclick = () => switchTab('upload');
    $('tab-manage').onclick = () => switchTab('manage');
    function switchTab(which) {
      const up = which === 'upload';
      $('tab-upload').classList.toggle('active', up);
      $('tab-manage').classList.toggle('active', !up);
      $('panel-upload').classList.toggle('hidden', !up);
      $('panel-manage').classList.toggle('hidden', up);
      if (!up && !manageLoaded) { manageLoaded = true; loadManage(); }
    }

    /* ── 올리기 ── */
    const fileInput = $('file-input'), preview = $('preview'), fileLabel = $('file-label');
    const msg = $('msg'), submitBtn = $('submit');
    $('date').value = new Date().toISOString().slice(0, 10);

    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0]; if (!f) return;
      fileLabel.textContent = f.name;
      const r = new FileReader();
      r.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
      r.readAsDataURL(f);
    });

    function show(type, text) { msg.className = type; msg.textContent = text; }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      const title = $('title').value.trim();
      const genre = $('genre').value;
      const date = $('date').value;
      const pw = $('password').value;

      if (!file) return show('err', '사진을 골라 주세요.');
      if (!title) return show('err', '제목을 적어 주세요.');
      if (!date) return show('err', '날짜를 골라 주세요.');
      if (!pw) return show('err', '비밀번호를 적어 주세요.');
      if (title.includes('_')) return show('err', '제목에 _(밑줄)은 쓸 수 없어요.');

      submitBtn.disabled = true;
      show('work', '올리는 중이에요… 잠시만 기다려 주세요.');
      try {
        const fd = new FormData();
        fd.append('image', file); fd.append('title', title);
        fd.append('genre', genre); fd.append('date', date); fd.append('password', pw);
        const res = await fetch(WORKER_URL, { method: 'POST', body: fd });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          show('ok', '올라갔어요! 🌼 1~2분 뒤 갤러리에 나타나요.');
          $('form').reset();
          preview.style.display = 'none';
          fileLabel.textContent = '사진 고르기 / 촬영하기';
          $('date').value = new Date().toISOString().slice(0, 10);
          manageLoaded = false;            // 관리 목록 새로고침 유도
        } else if (res.status === 401) {
          show('err', '비밀번호가 맞지 않아요.');
        } else {
          show('err', '올리지 못했어요: ' + (data.error || res.status));
        }
      } catch {
        show('err', '인터넷 연결을 확인해 주세요.');
      } finally {
        submitBtn.disabled = false;
      }
    });

    /* ── 관리(삭제) ── */
    const grid = $('grid'), mmsg = $('manage-msg'), countEl = $('count');
    let ITEMS = [];

    function parse(name) {
      const nfc = name.normalize('NFC');
      const [b] = nfc.split(/\.(?=[^.]+$)/);
      const base = nfc.replace(/\.(png|jpe?g)$/i, '');
      const parts = b.split('_');
      let [title = '', genre = '', date = ''] = parts;
      if (parts.length === 2) [title, date] = parts;
      return {
        filename: nfc, title: title.replace(/-/g, ' ').trim() || 'Untitled',
        genre: genre.trim(), date,
        src: `images/${nfc}`,
        thumb: SUPPORTS_WEBP ? `images/webp/${base}.webp` : `images/${nfc}`,
      };
    }

    async function loadManage() {
      mmsg.style.display = 'block'; mmsg.textContent = '불러오는 중…';
      try {
        const res = await fetch(`images/images.json?v=${Date.now()}`, { cache: 'no-cache' });
        const files = await res.json();
        ITEMS = files.map(parse).sort((a, b) => b.date.localeCompare(a.date));
        renderManage();
      } catch { mmsg.textContent = '목록을 불러오지 못했어요.'; }
    }

    function renderManage() {
      const q = $('search').value.normalize('NFC').trim().toLowerCase();
      const list = ITEMS.filter(m => !q || m.title.toLowerCase().includes(q));
      countEl.textContent = `${list.length}개`;
      mmsg.style.display = list.length ? 'none' : 'block';
      if (!list.length) mmsg.textContent = '작품이 없어요.';
      grid.innerHTML = '';
      list.forEach(m => {
        const div = document.createElement('div'); div.className = 'item';
        const img = document.createElement('img');
        img.loading = 'lazy'; img.alt = m.title; img.src = m.thumb;
        img.onerror = function () { if (!this.src.endsWith(m.src)) this.src = m.src; };
        const meta = document.createElement('div'); meta.className = 'meta';
        meta.innerHTML = `<div class="t"></div><div class="s"><span class="g"></span> · <span class="d"></span></div>`;
        meta.querySelector('.t').textContent = m.title;
        meta.querySelector('.g').textContent = m.genre;
        meta.querySelector('.d').textContent = m.date;
        const btn = document.createElement('button');
        btn.textContent = '🗑 삭제';
        btn.onclick = () => del(m, div, btn);
        div.append(img, meta, btn);
        grid.appendChild(div);
      });
    }

    async function del(m, div, btn) {
      const pw = $('password').value;
      if (!pw) { alert('먼저 위쪽에 비밀번호를 입력하세요.'); $('password').focus(); return; }
      if (!confirm(`"${m.title}" (${m.genre} · ${m.date}) 작품을 정말 삭제할까요?\n되돌릴 수 없어요.`)) return;
      btn.disabled = true; btn.textContent = '삭제 중…';
      try {
        const fd = new FormData();
        fd.append('action', 'delete'); fd.append('filename', m.filename); fd.append('password', pw);
        const res = await fetch(WORKER_URL, { method: 'POST', body: fd });
        if (res.ok) {
          div.classList.add('gone'); btn.textContent = '삭제됨 ✓';
          ITEMS = ITEMS.filter(x => x.filename !== m.filename);
        } else if (res.status === 401) {
          alert('비밀번호가 맞지 않아요.'); btn.disabled = false; btn.textContent = '🗑 삭제';
        } else {
          const d = await res.json().catch(() => ({}));
          alert('삭제하지 못했어요: ' + (d.error || res.status));
          btn.disabled = false; btn.textContent = '🗑 삭제';
        }
      } catch {
        alert('인터넷 연결을 확인해 주세요.');
        btn.disabled = false; btn.textContent = '🗑 삭제';
      }
    }

    $('search').addEventListener('input', renderManage);
  </script>
</body>
</html>
